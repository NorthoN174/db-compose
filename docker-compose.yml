services:
  postgres:
    image: postgres:15-alpine
    container_name: pg_master
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: pg_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  python_app:
    build: .
    container_name: py_runner
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      DB_PASS: ${DB_PASS}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
    external: true
