services:
  postgres:
    image: postgres:15-alpine
    container_name: pg_master
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: pg_adminer
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      - postgres
    restart: unless-stopped

  python_app:
    build: .
    container_name: py_runner
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      DB_PASS: ${DB_PASS}
#      FLASK_DEBUG: 1
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: web_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      - python_app
    restart: unless-stopped

volumes:
  pg-data:
    external: true

networks:
  frontend:
  backend:
