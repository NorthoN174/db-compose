services:
  postgres:
    image: postgres:15-alpine
    container_name: pg_master
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pg-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: pg_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  python_app:
    build: .
    container_name: py_runner
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      DB_PASS: ${DB_PASS}

volumes:
  pg-data:
    external: true
